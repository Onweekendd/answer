<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
        font:
          13px/1.5 system-ui,
          sans-serif;
        color: #1f2328;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8c959f;
      }
      #dot[data-state="open"] {
        background: #1a7f37;
      }
      #dot[data-state="connecting"] {
        background: #bf8700;
      }
      #detail {
        margin: 4px 0 12px;
        color: #59636e;
        word-break: break-all;
      }
      form {
        display: grid;
        gap: 8px;
      }
      label {
        display: grid;
        gap: 2px;
        color: #59636e;
      }
      input {
        padding: 4px 6px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="status"><span id="dot"></span><span id="state">未连接</span></div>
    <div id="detail"></div>
    <form id="form">
      <label>Hub 地址 <input id="hubUrl" type="text" spellcheck="false" /></label>
      <label>Token <input id="token" type="password" autocomplete="off" /></label>
      <button type="submit">保存并重连</button>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
