# 「买不买」单机部署：answer + PostgreSQL
#
# 在服务器的 deploy/ 目录下：
#   cp .env.example .env      # 然后填写 .env
#   docker compose config     # 先检查写法，会打印展开 ${...} 后的最终配置
#   docker compose up -d
# 首次访问 http://<服务器IP>:8080 会进入安装向导。

# 项目名。卷、网络、容器名都以它为前缀（如 maibumai_pgdata）。
# 不写的话默认用目录名 deploy，目录一改就会拿到一个新的空卷。
name: maibumai

services:
  answer:
    # 要运行的镜像。CI 推到 GHCR（地址必须全小写）；tag 取 .env 里的 TAG，
    # 没设置时用 latest。本机测试时用 docker build -t 打成同一个名字即可，不必推送。
    image: ghcr.io/onweekendd/answer:${TAG:-latest}
    # 进程崩溃或服务器重启后自动拉起；手动 docker compose stop 的不拉起
    restart: unless-stopped
    # "宿主机端口:容器端口"。answer 在容器里监听 80（Dockerfile 的 EXPOSE），
    # 对外默认用 8080：服务器没备案，先用 IP + 非 80 端口访问。
    # 本机 8080 被占用时，在 .env 里设 ANSWER_PORT 换一个。
    ports:
      - "${ANSWER_PORT:-8080}:80"
    volumes:
      # 命名卷挂到 /data：上传文件、config.yaml、i18n 都在这里，删容器不会丢
      - answer-data:/data
    environment:
      # 对话页的 Agent 通过 hub 操作浏览器；用服务名 hub 访问，不出 compose 的内部网络
      BROWSER_HUB_URL: http://hub:8765
      BROWSER_HUB_TOKEN: ${BROWSER_HUB_TOKEN:?在 deploy/.env 里设置 BROWSER_HUB_TOKEN}
      # Agent 存的图放进 Garage（S3 接口），不放 /data。密钥由 deploy.sh 第一次部署时生成到 .env
      S3_ENDPOINT: garage:3900
      S3_BUCKET: ${S3_BUCKET:-maibumai}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?在 deploy/.env 里设置 S3_ACCESS_KEY_ID（deploy.sh 会自动生成）}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?在 deploy/.env 里设置 S3_SECRET_ACCESS_KEY（deploy.sh 会自动生成）}
    depends_on:
      db:
        # 不只是等 db 容器启动，而是等下面的 healthcheck 通过，
        # 否则 answer 启动时 PG 可能还没准备好，连接会失败
        condition: service_healthy
      garage:
        # Garage 起来以后还要 garage-init.sh 建桶；没建好之前存图会失败，不影响 answer 启动
        condition: service_started

  # 浏览器 Hub：插件连到这里，answer 通过它操作浏览器。和 answer 用同一个镜像，只是运行 answer browser。
  # 它能操作一个登录着淘宝、京东的浏览器，所以不对公网开放：端口只绑在服务器自己的 127.0.0.1 上，
  # 要用的时候在自己电脑上开 SSH 隧道（ssh -N -L 8765:127.0.0.1:8765 用户@服务器），
  # 插件照旧连 ws://127.0.0.1:8765/agent，token 填 .env 里的 BROWSER_HUB_TOKEN
  hub:
    image: ghcr.io/onweekendd/answer:${TAG:-latest}
    restart: unless-stopped
    # 在容器里要监听 0.0.0.0，answer 才能从内部网络连过来；对外只发布到宿主机的 127.0.0.1
    entrypoint: ["dumb-init", "--", "answer", "browser", "--addr", "0.0.0.0:8765"]
    environment:
      BROWSER_HUB_TOKEN: ${BROWSER_HUB_TOKEN:?在 deploy/.env 里设置 BROWSER_HUB_TOKEN}
    ports:
      - "127.0.0.1:8765:8765"

  # 对象存储：Agent 存的图。Docker Hub 上官方 dxflrs/garage 在 GHCR 的转存（理由同下面的 pgvector）。
  # 镜像里只有 garage 一个程序，初始化（分配存储、建桶、导入密钥）由 garage-init.sh 从宿主机发命令。
  # 没有 ports：只有 answer 在内部网络里用 http://garage:3900 访问，图片经 answer 的 /uploads/agent/ 给用户
  garage:
    image: ghcr.io/onweekendd/garage:v1.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?在 deploy/.env 里设置 GARAGE_RPC_SECRET（deploy.sh 会自动生成）}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  db:
    # 带 pgvector 扩展的 PostgreSQL 16，需求 5 的向量检索要用。
    # 这是 Docker Hub 上官方 pgvector/pgvector:pg16 在 GHCR 的转存：服务器访问
    # Docker Hub 要经过第三方加速源，不可信；只从 GHCR 拉，来源就只有一个。
    image: ghcr.io/onweekendd/pgvector:pg16
    restart: unless-stopped
    environment:
      # 只在第一次初始化数据目录时生效：建出这个用户和这个库
      POSTGRES_USER: answer
      POSTGRES_DB: answer
      # 从同目录的 .env 读取；没设置或为空时，compose 直接报这句错误并退出，
      # 不会用空密码把数据库启动起来
      POSTGRES_PASSWORD: ${DB_PASSWORD:?在 deploy/.env 里设置 DB_PASSWORD}
    volumes:
      # PG 16 镜像把数据放在 /var/lib/postgresql/data（镜像文档里的 PGDATA）。
      # 挂成命名卷，容器重建、镜像升级都不会丢数据
      - pgdata:/var/lib/postgresql/data
    # 故意没有 ports：数据库只在 compose 的内部网络里，公网连不到；
    # answer 用服务名 db 访问它（安装向导里数据库地址填 db:5432）。
    healthcheck:
      # 在 db 容器里执行 pg_isready：PG 能接受连接时返回 0，即「健康」。
      # CMD-SHELL 表示交给容器里的 sh 执行这一整条命令
      test: ["CMD-SHELL", "pg_isready -U answer -d answer"]
      # 每 5 秒检查一次，单次 3 秒超时，连续失败 10 次才判定为不健康
      interval: 5s
      timeout: 3s
      retries: 10

# 声明上面用到的命名卷，由 Docker 管理，实际存放在 /var/lib/docker/volumes/ 下
volumes:
  answer-data:
  pgdata:
  garage-meta:
  garage-data:
